name: Publish Windows release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-windows.yml'
  workflow_dispatch:

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build SkyTiles.exe
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements-dev.lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/package_windows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test the standalone executable
        run: python tests/smoke_exe.py

      - name: Publish the executable to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Expected a stable version in package.json"
          }
          $tag = "v$version"
          $existing = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft,assets 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $existing | ConvertFrom-Json
            if (-not $release.isDraft -and $release.assets.name -contains 'SkyTiles.exe') {
              Write-Host "$tag already includes SkyTiles.exe."
              exit 0
            }
            throw "Release $tag already exists and needs review before publishing."
          }

          $hash = (Get-FileHash release/SkyTiles.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $notes = @"
          **Windows x64** · 单文件可执行程序

          在 Assets 中下载 **SkyTiles.exe**，放到有写入权限的文件夹并双击。程序会在默认浏览器中打开。升级时请先退出司图，再替换 EXE 并保留旁边的整个 data 文件夹。

          Download **SkyTiles.exe** from Assets, save it in a writable folder, and double-click it. The app opens in your default browser. To upgrade, exit SkyTiles, replace the EXE, and keep its data folder.

          SHA-256: $hash
          "@
          $notesPath = Join-Path $env:RUNNER_TEMP 'skytiles-release-notes.md'
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8NoBOM
          gh release create $tag release/SkyTiles.exe --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "SkyTiles · 司图 $tag" --notes-file $notesPath --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
